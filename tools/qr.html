<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Code Generator</title>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #0f0f0f;
  color: #e0e0e0;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
.container {
  text-align: center;
  padding: 2rem;
}
h1 {
  font-size: 1.5rem;
  font-weight: 400;
  letter-spacing: 0.1em;
  margin-bottom: 2rem;
  color: #888;
}
#qrcode {
  display: inline-block;
  padding: 1.5rem;
  background: #fff;
  border-radius: 12px;
}
#qrcode img { display: block; }
#url-display {
  margin-top: 1.5rem;
  max-width: 320px;
  word-break: break-all;
  font-size: 0.75rem;
  color: #666;
  line-height: 1.5;
}
.error {
  color: #e74c3c;
  font-size: 0.9rem;
  margin-top: 2rem;
}
.footer {
  margin-top: 3rem;
  font-size: 0.7rem;
  color: #444;
}
</style>
</head>
<body>
<div class="container">
  <h1>QR Code</h1>
  <div id="qrcode"></div>
  <div id="url-display"></div>
  <div id="error" class="error" style="display:none"></div>
  <div class="footer">WAHSUN / sing-box</div>
</div>
<script>
(function() {
  var url = location.hash.replace(/^#/, '') || '';
  var qrEl = document.getElementById('qrcode');
  var urlEl = document.getElementById('url-display');
  var errEl = document.getElementById('error');

  if (!url) {
    errEl.textContent = '請在 URL 後附加 #你的配置連結';
    errEl.style.display = 'block';
    return;
  }

  try {
    new QRCode(qrEl, {
      text: url,
      width: 256,
      height: 256,
      colorDark: '#000000',
      colorLight: '#ffffff',
      correctLevel: QRCode.CorrectLevel.M
    });
    urlEl.textContent = url;
  } catch(e) {
    errEl.textContent = 'QR 碼生成失敗: ' + e.message;
    errEl.style.display = 'block';
  }
})();
</script>
</body>
</html>
