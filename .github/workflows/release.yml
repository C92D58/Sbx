name: Main

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2 (SHA-pinned)
        with:
          fetch-depth: 0
      - name: get ver
        run: |
          echo "$(cat *.sh | grep is_sh_ver=)" >> $GITHUB_ENV
          echo "old=$(git tag | tail -n1)" >> $GITHUB_ENV
      - name: tar
        run: tar zcvf code.tar.gz ./*
      - name: release
        uses: softprops/action-gh-release@e5ee6bc58a36b838b92fc1217f2e4b414b5abcc8 # v3.0.2 (SHA-pinned)
        with:
          files: code.tar.gz
          tag_name: ${{ env.is_sh_ver }}
