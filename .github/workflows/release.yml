name: Main

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2 (SHA-pinned)
        with:
          fetch-depth: 0
      - name: get ver
        run: |
          echo "$(cat *.sh | grep is_sh_ver=)" >> $GITHUB_ENV
          echo "old=$(git tag | tail -n1)" >> $GITHUB_ENV
      - name: tar
        run: tar zcvf code.tar.gz ./*
      - name: release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb2471b2d6b0e4d4d8f2e6a # v2.2.1 (SHA-pinned)
        with:
          files: code.tar.gz
          tag_name: ${{ env.is_sh_ver }}
